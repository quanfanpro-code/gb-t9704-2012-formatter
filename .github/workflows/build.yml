name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore .\GB-T9704-2012排版工具.Tests\GB-T9704-2012排版工具.Tests.csproj
      - run: dotnet build .\GB-T9704-2012排版工具.Tests\GB-T9704-2012排版工具.Tests.csproj -c Release --no-restore
      - run: dotnet test .\GB-T9704-2012排版工具.Tests\GB-T9704-2012排版工具.Tests.csproj -c Release --no-build
      - run: dotnet format .\GB-T9704-2012排版工具.csproj --verify-no-changes --no-restore
      - run: dotnet format .\GB-T9704-2012排版工具.Tests\GB-T9704-2012排版工具.Tests.csproj --verify-no-changes --no-restore
